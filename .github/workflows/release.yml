name: APK & Webseite veröffentlichen

# Läuft bei jedem Push auf main (und manuell über "Run workflow").
# 1. Webseite (iPhone/Browser-Version + Download-Seite + version.json) → Branch gh-pages
# 2. APK bauen und als GitHub-Release veröffentlichen – sobald die Secrets KEYSTORE_B64 und KEYSTORE_PASS eingetragen sind.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version festlegen
        env:
          HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' && secrets.KEYSTORE_PASS != '' }}
        run: |
          BASE=$(cat VERSION)
          echo "VN=${BASE}.${{ github.run_number }}" >> $GITHUB_ENV
          echo "VC=$((100 + ${{ github.run_number }}))" >> $GITHUB_ENV
          { echo 'NOTES<<EOF'; git log -1 --pretty=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session'; echo 'EOF'; } >> $GITHUB_ENV
          if [ "$HAS_KEY" = "true" ]; then echo "APK_AVAILABLE=1" >> $GITHUB_ENV; else
            echo "::warning::Secrets KEYSTORE_B64/KEYSTORE_PASS fehlen – nur die Webseite wird veröffentlicht, keine APK."; fi

      # ---------- APK (nur mit Signaturschlüssel) ----------
      - uses: actions/setup-java@v5
        if: env.APK_AVAILABLE == '1'
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        if: env.APK_AVAILABLE == '1'
        with: { gradle-version: "8.7" }

      - name: Spiel und Webseite bauen
        env:
          APP_VERSION: ${{ env.VN }}
          APP_VERSION_CODE: ${{ env.VC }}
          APP_NOTES: ${{ env.NOTES }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: python3 build.py --web site

      - name: APK bauen
        if: env.APK_AVAILABLE == '1'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          export KS_FILE="$RUNNER_TEMP/release.keystore"
          echo "sdk.dir=$ANDROID_HOME" > local.properties   # vorinstalliertes Android-SDK des Runners
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          gradle assembleRelease --no-daemon -PvcCode=$VC -PvcName=$VN \
            "-PupdateUrl=https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/version.json https://$OWNER_LC.github.io/${{ github.event.repository.name }}/version.json"
          cp app/build/outputs/apk/release/app-release.apk ../EinsatzDuell.apk
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: GitHub-Release erstellen
        if: env.APK_AVAILABLE == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VN" EinsatzDuell.apk --title "Einsatz-Duell $VN" --notes "$NOTES" --latest

      # ---------- Webseite ----------
      - name: Webseite auf gh-pages veröffentlichen
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Webseite ${{ env.VN }}
