<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1035">
<title>Einladung zum Einsatz-Duell</title>
<meta property="og:title" content="Einladung zum Einsatz-Duell!">
<meta property="og:description" content="Du wurdest zu einem Online-Duell eingeladen: Polizei gegen Verbrecher. Tippe zum Beitreten.">
<meta property="og:image" content="__SITE__/spiel/icon-512.png">
<link rel="icon" href="spiel/icon-192.png">
<style>
@font-face{font-family:"Bangers";src:url(data:font/woff2;base64,__FONT__) format("woff2")}
:root{--ink:#111;--paper:#fff8e7;--yellow:#ffd23f;--red:#ff3b3b;--blue:#3fa9ff;--green:#3ddc84;--comic:"Bangers",Impact,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--paper);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;
  background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.08) 1.3px,transparent 1.6px) 0 0/10px 10px,linear-gradient(160deg,#2c1a57,#1b1035);
  padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 30px)}
main{max-width:480px;margin:0 auto}
.icon{width:96px;height:96px;border-radius:22px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);transform:rotate(-4deg)}
h1{font-family:var(--comic);font-size:clamp(40px,11vw,56px);line-height:.95;margin:16px 0 6px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--red),9px 9px 0 var(--ink);letter-spacing:2px}
.code{font-family:var(--comic);font-size:58px;letter-spacing:10px;color:var(--yellow);-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);margin:6px 0 18px}
.btn{display:block;text-decoration:none;font-family:var(--comic);letter-spacing:1px;font-size:24px;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);
  border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin:14px 0;min-height:44px}
.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.ghost{background:#fff;font-size:18px}
.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.muted{opacity:.75;font-size:14px}
</style>
</head>
<body>
<main>
  <img class="icon" src="spiel/icon-512.png" alt="">
  <h1>DU WURDEST HERAUSGEFORDERT!</h1>
  <p>Online-Duell im Einsatz-Duell – Polizei gegen Verbrecher.<br>Raumcode:</p>
  <div class="code" id="code">–––––</div>
  <a class="btn green" id="app" href="#">📱 In der App öffnen</a>
  <a class="btn blue" id="web" href="spiel/">▶ Im Browser spielen</a>
  <a class="btn ghost" href="./">⬇ App noch nicht installiert? Hier laden</a>
  <p class="muted">Der Raum bleibt offen, solange dein Gegner in der Lobby wartet.</p>
</main>
<script>
const code=((new URLSearchParams(location.search).get("c")||location.hash.slice(1)||"").toUpperCase().replace(/[^A-Z0-9]/g,"")).slice(0,5);
document.getElementById("code").textContent=code||"?????";
document.getElementById("web").href="spiel/#join-"+code;
const isAndroid=/Android/i.test(navigator.userAgent);
const app=document.getElementById("app");
if(isAndroid){
  // Öffnet die installierte App; ist sie nicht installiert, geht es zur Web-Version
  app.href="intent://join/"+code+"#Intent;scheme=einsatzduell;package=de.kartenduell.app;S.browser_fallback_url="+encodeURIComponent(location.origin+location.pathname.replace(/join\.html$/,"")+"spiel/#join-"+code)+";end";
} else { app.style.display="none"; }
</script>
</body>
</html>
